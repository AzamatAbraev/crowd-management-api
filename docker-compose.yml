services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:

      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_AUTH_ANONYMOUS_ENABLED=false

      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana-oauth
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=srktsCAfYiMYpR5Vv0dxCcCx5TsDWkDm
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=http://172.26.164.80:8080/realms/crowd-management/protocol/openid-connect/auth
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=http://172.26.164.80:8080/realms/crowd-management/protocol/openid-connect/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=http://172.26.164.80:8080/realms/crowd-management/protocol/openid-connect/userinfo

      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(roles[*], 'theking') && 'GrafanaAdmin' || contains(roles[*], 'system_admin') && 'Admin' || contains(roles[*], 'facility_manager') && 'Editor' || 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=true
      - GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN=true
      - GF_AUTH_OAUTH_AUTO_LOGIN=false

      - GF_LOG_LEVEL=debug
    volumes:
      - grafana-storage:/var/lib/grafana

  influxdb3-core:
    image: influxdb:3-core
    container_name: influxdb
    restart: unless-stopped
    user: root
    ports:
      - "8181:8181"
    volumes:
      - influxdb-storage:/var/lib/influxdb3/data
    command:
      - serve
      - --without-auth
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data

volumes:
  influxdb-storage:
  grafana-storage:
